# Nginx для QP Tool. Плейсхолдер __DOMAIN__ подставляется скриптом setup.sh.
# Фронтенд (dist) отдаётся статикой, /api и /admin проксируются в Gunicorn,
# /media и /static — с диска. Всё на одном домене → CORS не нужен.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/qptool/frontend/dist;
    index index.html;

    # разрешаем загрузку PDF-каталогов через админку
    client_max_body_size 50M;

    # Security-заголовки для статики (Django ставит свои только на /api и /admin).
    # SAMEORIGIN, а не DENY — просмотрщик PDF-каталогов работает через iframe.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS без includeSubDomains — на домене есть почтовые поддомены.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP: разрешаем только реально используемые источники (шрифты Google,
    # Яндекс.Метрика/GA, Яндекс.Карты в iframe). 'unsafe-inline' нужен React/Vite.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://www.google-analytics.com; frame-src 'self' https://yandex.ru https://*.yandex.ru; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    # Django API + токен-авторизация
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/proxy_params;
    }

    # Django-админка
    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/proxy_params;
    }

    # загруженные файлы (фото, логотипы, PDF-каталоги)
    location /media/ {
        alias /var/www/qptool/backend/media/;
        expires 30d;
    }

    # статика Django (админка)
    location /static/ {
        alias /var/www/qptool/backend/staticfiles/;
        expires 30d;
    }

    # хешированные ассеты фронтенда — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой неизвестный путь отдаём index.html (роутинг на клиенте)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
