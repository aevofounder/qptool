<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f10" />

    <!-- Favicons / PWA. Растровый apple-touch-icon.png (180×180) стоит
         добавить вручную для iOS — см. README. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/logo.svg" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>QP Tool — металлорежущий инструмент и оснащение станков</title>
    <meta
      name="description"
      content="QP Tool — официальный поставщик металлорежущего инструмента и оснащения станков в Екатеринбурге с 2009 года. Фрезы, свёрла, токарные пластины, метчики и резцы со склада и под заказ."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://qptool.ru/" />

    <!-- Open Graph / Twitter (per-route values are refined client-side) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QP Tool" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://qptool.ru/" />
    <meta property="og:title" content="QP Tool — металлорежущий инструмент и оснащение станков" />
    <meta
      property="og:description"
      content="Официальный поставщик металлорежущего инструмента и оснащения станков в Екатеринбурге с 2009 года."
    />
    <meta property="og:image" content="https://qptool.ru/assets/og-cover.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://qptool.ru/assets/og-cover.svg" />

    <!-- Organization structured data (static fallback for crawlers) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ООО «КуПиТул» (QP Tool)",
        "url": "https://qptool.ru",
        "foundingDate": "2009",
        "email": "info@qptool.ru",
        "telephone": "+7-343-302-00-96",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Екатеринбург",
          "addressCountry": "RU",
          "streetAddress": "ул. Московская, д. 195, офис 1026, 1037",
          "postalCode": "620144"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+7-343-302-00-96",
          "contactType": "sales",
          "email": "info@qptool.ru"
        }
      }
    </script>

    <!--
      Веб-шрифты (Google Fonts) грузятся НЕблокирующе: `media="print"` + onload
      снимает их из критического пути рендера, поэтому если fonts.googleapis.com
      недоступен (актуально для РФ), страница мгновенно отрисуется системными
      шрифтами и не «зависнет» в ожидании. Для продакшена рекомендуется
      self-hosting шрифтов (см. README) — тогда зависимость от Google исчезает.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
