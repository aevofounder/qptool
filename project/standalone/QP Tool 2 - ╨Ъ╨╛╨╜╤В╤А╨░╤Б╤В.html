document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        if (!entry.compressed && entry.mime.indexOf('image/') === 0) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' + entry.data;
          return;
        }
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

#B00014;\">Запросить цену<\u002Fbutton>\n          <button onclick=\"{{ goCatalog }}\" style=\"font-family:'Manrope',sans-serif; font-size:15px; font-weight:600; color:#14110F; background:transparent; border:1px solid #C9C9C4; padding:15px 24px; border-radius:4px; cursor:pointer; transition:border-color .2s;\" style-hover=\"border-color:#14110F;\">← В каталог<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- related -->\n    <div style=\"padding:0 56px 72px; max-width:1440px; margin:0 auto;\">\n      <div style=\"border-top:1px solid #E2E1DD; padding-top:40px;\">\n        <h2 style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:700; font-size:26px; letter-spacing:-0.02em; margin:0 0 28px;\">Похожие позиции<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:20px;\">\n          <sc-for list=\"{{ related }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div onclick=\"{{ p.open }}\" style=\"background:#FAFAF8; border:1px solid #E2E1DD; border-radius:6px; overflow:hidden; cursor:pointer; transition:transform .2s,border-color .2s;\" style-hover=\"transform:translateY(-4px); border-color:#C9C9C4;\">\n              <div style=\"position:relative; aspect-ratio:4/3; background:#EDEDE9; border-bottom:1px solid #E2E1DD; background-image:repeating-linear-gradient(45deg,rgba(20,17,15,0.04) 0,rgba(20,17,15,0.04) 1px,transparent 1px,transparent 10px);\"><span style=\"position:absolute; top:10px; left:10px; font-family:'JetBrains Mono',monospace; font-size:9.5px; color:#E30016;\">{{ p.code }}<\u002Fspan><\u002Fdiv>\n              <div style=\"padding:14px;\"><h4 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; margin:0; line-height:1.25;\">{{ p.name }}<\u002Fh4><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== SOLUTION ===================== -->\n  <sc-if value=\"{{ isSolution }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <div style=\"padding:36px 56px 0; max-width:1440px; margin:0 auto;\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:0.06em; color:#8A8782;\"><span onclick=\"{{ goHome }}\" style=\"cursor:pointer;\" style-hover=\"color:#E30016;\">ГЛАВНАЯ<\u002Fspan> / <span style=\"color:#14110F;\">РЕШЕНИЯ<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <!-- hero -->\n    <div style=\"padding:48px 56px 56px; border-bottom:1px solid #E2E1DD; background-image:linear-gradient(#ECECE8 1px,transparent 1px),linear-gradient(90deg,#ECECE8 1px,transparent 1px); background-size:48px 48px;\">\n      <div style=\"max-width:1328px; margin:0 auto;\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0.14em; color:#E30016; margin-bottom:20px;\">КОМПЛЕКСНОЕ ОСНАЩЕНИЕ<\u002Fdiv>\n        <h1 style=\"font-family:'Archivo Expanded','Archivo',sans-serif; font-weight:800; font-size:56px; line-height:1.0; letter-spacing:-0.025em; margin:0 0 20px; max-width:900px;\">Оснащение станков под ключ для вашего производства<\u002Fh1>\n        <p style=\"font-size:18px; line-height:1.6; color:#54514C; margin:0 0 32px; max-width:640px;\">Берём на себя подбор, поставку и сопровождение всего режущего и вспомогательного инструмента под конкретный парк оборудования вашего цеха.<\u002Fp>\n        <button onclick=\"{{ goContacts }}\" style=\"font-family:'Manrope',sans-serif; font-size:15px; font-weight:600; color:#fff; background:#E30016; border:none; padding:16px 30px; border-radius:4px; cursor:pointer; transition:background .2s;\" style-hover=\"background:#B00014;\">Обсудить проект<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- problem / value -->\n    <div style=\"padding:64px 56px; max-width:1440px; margin:0 auto;\">\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:32px;\">\n        <div style pan><span>+7 (912) 051-82-21<\u002Fspan><span>{{ email }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em; color:#6B6864; margin-bottom:16px;\">ЗАЯВКА<\u002Fdiv><p style=\"font-size:14px; color:#9A9793; margin:0 0 16px; line-height:1.6;\">Перезвоним в течение рабочего дня.<\u002Fp><button onclick=\"{{ goContacts }}\" style=\"font-family:'Manrope',sans-serif; font-size:14px; font-weight:600; color:#14110F; background:#fff; border:none; padding:13px 24px; border-radius:4px; cursor:pointer;\" style-hover=\"background:#E30016; color:#fff;\">Оставить заявку<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6B6864; padding-top:24px;\">© 2009 ООО «КуПиТул» · Все права защищены<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { screen: 'home', heroIdx: 0, product: null, cat: 'all' };\n\n  componentDidMount() {\n    this._t = setInterval(() => {\n      if (this.state.screen === 'home') this.setState(s => ({ heroIdx: (s.heroIdx + 1) % 3 }));\n    }, 5000);\n  }\n  componentWillUnmount() { clearInterval(this._t); }\n\n  top() { try { window.scrollTo(0, 0); } catch (e) {} }\n\n  renderVals() {\n    const email = 'info' + String.fromCharCode(64) + 'qptool.ru';\n    const screen = this.state.screen;\n\n    const services = [\n      { n: '01', tag: 'Металлорежущий инструмент', short: 'Металлорежущий\\nинструмент',\n        title: 'Режущий инструмент для вашего предприятия',\n        desc: 'Фрезы, свёрла, токарные пластины, метчики и резцы от проверенных мировых производителей — со склада и под заказ.' },\n      { n: '02', tag: 'Оснащение станков', short: 'Оснащение\\nстанков',\n        title: 'Комплексное оснащение станков со скидкой',\n        desc: 'Подберём и поставим полный комплект оснастки под конкретный парк оборудования вашего цеха.' },\n      { n: '03', tag: 'Инжиниринговые решения', short: 'Инжиниринг\\nпод ключ',\n        title: 'Профессиональный подбор инструмента под ключ',\n        desc: 'Разрабатываем технологию, подбираем инструмент по техническому заданию и участвуем в запуске проекта.' },\n    ];\n\n    const go = (sc) => { this.setState({ screen: sc, product: null }); this.top(); };\n    const openProduct = (p) => { this.setState({ screen: 'product', product: p }); this.top(); };\n    const setCat = (c) => this.setState({ cat: c });\n\n    const products = [\n      { code: 'FR-1204', name: 'Фреза концевая Ø12', cat: 'frezy', catLabel: 'Фрезы', brand: 'Sandvik', material: 'Твердосплав',\n        specs: [['Диаметр', '12 мм'], ['Число зубьев', '4'], ['Покрытие', 'TiAlN'], ['Хвостовик', 'Цилиндрический'], ['Длина', '83 мм'], ['Обработка', 'Сталь, чугун']],\n        desc: 'Концевая твердосплавная фреза для черновой и чистовой обработки сталей и чугунов. Покрытие TiAlN повышает стойкость на высоких скоростях резания.' },\n      { code: 'SV-0850', name: 'Сверло спиральное Ø8.5', cat: 'sverla', catLabel: 'Свёрла', brand: 'Walter', material: 'HSS-Co',\n        specs: [['Диаметр', '8.5 мм'], ['Угол при вершине', '140°'], ['Покрытие', 'TiN'], ['Хвостовик', 'Цилиндрический'], ['Длина', '117 мм'], ['Обработка', 'Сталь, нерж.']],\n        desc: 'Спиральное сверло из кобальтовой быстрорежущей стали для сверления конструкционных и нержавеющих сталей.' },\n      { code: 'PL-CNMG', name: 'Пластина токарная CNMG', cat: 'plastiny', catLabel: 'Токарные пластины', brand: 'Korloy', material: 'Твердосплав',\n        specs: [['Тип', 'CNMG 120408'], ['Радиус', '0.8 мм'], ['Покрытие', 'CVD'], ['Геометрия', 'PM'], ['Обработка', 'Сталь'], ['Класс', 'P25']],\n        desc: 'Сменная многогранная пластина для токарной обработки сталей. Универсальная геометрия для получистовой и чистовой обработки.' },\n      { code: 'MT-M1015', name: 'Метчик машинный M10', cat: 'metchiki', catLabel: 'Метчики', brand: 'YG-1', material: 'HSS-E',\n        specs: [['Резьба', 'M10 × 1.5'], ['Класс', '6H'], ['Покрытие', 'TiCN'], ['Хвостовик', 'DIN 371'], ['Заборная часть', '3-4 нитки'], ['Обработка', 'Сталь']],\n        desc: 'Машинный метчик для нарезания метрической резьбы M10 в сквозных и глухих отверстиях стальных деталей.' },\n      { code: 'RZ-2520', name: 'Резец проходной 25×20', cat: 'rezcy', catLabel: 'Резцы', brand: 'QP Tool', material: 'Державка + пластина',\n        specs: [['Сечение', '25 × 20 мм'], ['Пластина', 'CNMG'], ['Тип', 'Проходной'], ['Угол', '95°'], ['Крепление', 'Рычажное'], ['Обработка', 'Сталь']],\n        desc: 'Проходной токарный резец со сменной пластиной для наружного продольного точения. Жёсткая державка обеспечивает стабильность.' },\n      { code: 'OS-ER32', name: 'Патрон цанговый ER32', cat: 'osnastka', catLabel: 'Оснастка', brand: 'BT40', material: 'Сталь',\n        specs: [['Конус', 'BT40'], ['Цанга', 'ER32'], ['Диапазон', '2–20 мм'], ['Биение', '≤0.005 мм'], ['Балансировка', 'G2.5'], ['Длина', '100 мм']],\n        desc: 'Цанговый патрон ER32 с конусом BT40 для закрепления концевого инструмента на станках с ЧПУ. Высокая точность биения.' },\n      { code: 'FR-0603', name: 'Фреза концевая Ø6', cat: 'frezy', catLabel: 'Фрезы', brand: 'Seco', material: 'Твердосплав',\n        specs: [['Диаметр', '6 мм'], ['Число зубьев', '3'], ['Покрытие', 'AlTiN'], ['Хвостовик', 'Цилиндрический'], ['Длина', '57 мм'], ['Обработка', 'Нерж., титан']],\n        desc: 'Трёхзубая твердосплавная фреза для обработки нержавеющих сталей и титановых сплавов. Покрытие AlTiN для высоких температур.' },\n      { code: 'SV-1200', name: 'Сверло корпусное Ø12', cat: 'sverla', catLabel: 'Свёрла', brand: 'Sandvik', material: 'Корпус + пластины',\n        specs: [['Диаметр', '12 мм'], ['Глубина', '3×D'], ['Пластины', 'сменные'], ['СОЖ', 'внутренний подвод'], ['Хвостовик', 'Weldon'], ['Обработка', 'Сталь']],\n        desc: 'Корпусное сверло со сменными пластинами для производительного сверления отверстий с внутренним подводом СОЖ.' },\n      { code: 'PL-WNMG', name: 'Пластина токарная WNMG', cat: 'plastiny', catLabel: 'Токарные пластины', brand: 'Korloy', material: 'Твердосплав',\n        specs: [['Тип', 'WNMG 080408'], ['Радиус', '0.8 мм'], ['Покрытие', 'CVD'], ['Геометрия', 'PC'], ['Обработка', 'Сталь, чугун'], ['Класс', 'P35']],\n        desc: 'Шестигранная негативная пластина для черновой и получистовой токарной обработки. Шесть режущих кромок.' },\n      { code: 'MT-M0810', name: 'Метчик машинный M8', cat: 'metchiki', catLabel: 'Метчики', brand: 'YG-1', material: 'HSS-E',\n        specs: [['Резьба', 'M8 × 1.25'], ['Класс', '6H'], ['Покрытие', 'без'], ['Хвостовик', 'DIN 371'], ['Заборная часть', '3-4 нитки'], ['Обработка', 'Чугун']],\n        desc: 'Машинный метчик для нарезания резьбы M8 в чугунных деталях. Прямые канавки для коротких сходящих стружек.' },\n      { code: 'FR-1606', name: 'Фреза дисковая Ø160', cat: 'frezy', catLabel: 'Фрезы', brand: 'Walter', material: 'Корпус + пластины',\n        specs: [['Диаметр', '160 мм'], ['Зубья', '12'], ['Пластины', 'сменные'], ['Посадка', 'Ø40'], ['Ширина', '6 мм'], ['Обработка', 'Сталь']],\n        desc: 'Дисковая фреза со сменными пластинами для пазовой и отрезной обработки. Высокая производительность съёма.' },\n      { code: 'OS-VISE6', name: 'Тиски станочные 160', cat: 'osnastka', catLabel: 'Оснастка', brand: 'QP Tool', material: 'Чугун',\n        specs: [['Ширина губок', '160 мм'], ['Раскрытие', '0–210 мм'], ['Высота', '78 мм'], ['Точность', '0.02 мм'], ['Усилие', '40 кН'], ['Масса', '24 кг']],\n        desc: 'Прецизионные станочные тиски для надёжного закрепления заготовок при фрезеровании. Закалённые губки.' },\n    ];\n\n    const catDefs = [\n      { id: 'all', label: 'Все' }, { id: 'frezy', label: 'Фрезы' }, { id: 'sverla', label: 'Свёрла' },\n      { id: 'plastiny', label: 'Токарные пластины' }, { id: 'metchiki', label: 'Метчики' },\n      { id: 'rezcy', label: 'Резцы' }, { id: 'osnastka', label: 'Резцы и резьба' },\n    ];\n    const cat = this.state.cat;\n    const filteredRaw = cat === 'all' ? products : products.filter(p => p.cat === cat);\n    const filtered = filteredRaw.map(p => ({ ...p, open: () => openProduct(p) }));\n\n    const catCount = (id) => id === 'all' ? products.length : products.filter(p => p.cat === id).length;\n    const cats = catDefs.map(c => ({\n      label: c.label, count: catCount(c.id), on: () => setCat(c.id),\n      style: 'display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left; background:' +\n        (cat === c.id ? '#F2F2EE' : 'transparent') + '; border:none; border-left:2px solid ' +\n        (cat === c.id ? '#E30016' : 'transparent') + '; padding:9px 12px; margin-left:-14px; cursor:pointer; font-family:Manrope,sans-serif; font-size:14.5px; font-weight:' +\n        (cat === c.id ? '600' : '500') + '; color:' + (cat === c.id ? '#14110F' : '#54514C') + '; transition:color .2s;',\n    }));\n\n    const cur = this.state.product;\n    const related = cur ? products.filter(p => p.cat === cur.cat && p.code !== cur.code).concat(products.filter(p => p.cat !== cur.cat)).slice(0, 4).map(p => ({ ...p, open: () => openProduct(p) })) : [];\n\n    const navStyleBase = 'white-space:nowrap; cursor:pointer; transition:color .2s; display:flex; align-items:center; gap:5px; color:';\n    const nav = [\n      { label: 'Продукция', on: () => go('catalog'), active: screen === 'catalog' || screen === 'product' },\n      { label: 'Решения', on: () => go('solution'), active: screen === 'solution' },\n      { label: 'О компании', on: () => go('about'), active: screen === 'about' },\n      { label: 'Контакты', on: () => go('contacts'), active: screen === 'contacts' },\n    ].map(n => ({ ...n, style: navStyleBase + (n.active ? '#E30016;' : '#D4D3CF;') }));\n\n    const tabs = services.map((sv, i) => ({ short: sv.short, on: () => this.setState({ heroIdx: i }) }));\n    const ind = {\n      position: 'absolute', left: 0, bottom: '-1px', height: '2px', width: '33.333%',\n      background: '#E30016', transform: `translateX(${this.state.heroIdx * 100}%)`,\n      transition: 'transform .5s cubic-bezier(.4,0,.2,1)',\n    };\n\n    const logos = [1, 2, 3, 4, 5, 6];\n    const articles = [\n      { meta: '12.06.2026 · ТЕХНОЛОГИИ', title: 'Как выбрать фрезу под конкретный материал' },\n      { meta: '04.06.2026 · ОСНАСТКА', title: 'Оснащение станка с ЧПУ: с чего начать' },\n      { meta: '28.05.2026 · ЭКОНОМИКА', title: 'Снижаем стоимость инструмента на 20%' },\n    ];\n\n    return {\n      email, screen,\n      isHome: screen === 'home', isCatalog: screen === 'catalog', isProduct: screen === 'product',\n      isSolution: screen === 'solution', isAbout: screen === 'about', isContacts: screen === 'contacts',\n      goHome: () => go('home'), goCatalog: () => go('catalog'), goSolution: () => go('solution'),\n      goAbout: () => go('about'), goContacts: () => go('contacts'),\n      openProduct, setCat, nav,\n      s: services[this.state.heroIdx], tabs, ind,\n      logos, articles,\n      products, filtered, cats, cat, product: this.state.product,\n      catalogCount: products.length, resetCat: () => setCat('all'), related,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
